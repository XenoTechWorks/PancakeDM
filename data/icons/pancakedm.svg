<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PancakeDM logo: a short stack with butter and syrup. -->
  <defs>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c27a"/>
      <stop offset="1" stop-color="#e08a3c"/>
    </linearGradient>
    <linearGradient id="syrup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8641e"/>
      <stop offset="1" stop-color="#8f3b10"/>
    </linearGradient>
  </defs>
  <!-- plate -->
  <ellipse cx="32" cy="54" rx="27" ry="6.5" fill="#f3e9db"/>
  <ellipse cx="32" cy="53" rx="21" ry="4" fill="#e3d4c0"/>
  <!-- three pancakes, bottom to top -->
  <rect x="9" y="41" width="46" height="11" rx="5.5" fill="#c87533"/>
  <rect x="9" y="39" width="46" height="10" rx="5" fill="url(#cake)"/>
  <rect x="10" y="30" width="44" height="11" rx="5.5" fill="#c87533"/>
  <rect x="10" y="28" width="44" height="10" rx="5" fill="url(#cake)"/>
  <rect x="11" y="19" width="42" height="11" rx="5.5" fill="#c87533"/>
  <rect x="11" y="17" width="42" height="10" rx="5" fill="url(#cake)"/>
  <!-- syrup over the top, dripping down the sides -->
  <path d="M13 21 Q13 15 20 15 L44 15 Q51 15 51 21 L51 27 Q51 30 49 30 Q47 30 47 27 L47 24 Q47 22 45 23 Q43 24 43 29 L43 35 Q43 38 40.5 38 Q38 38 38 35 L38 25 Q38 23 36 23.5 L28 24 Q26 24 26 26 L26 31 Q26 33.5 23.5 33.5 Q21 33.5 21 31 L21 25 Q21 23 19 23.5 Q17 24 17 26 Q17 28 15 28 Q13 28 13 25 Z" fill="url(#syrup)"/>
  <!-- syrup shine -->
  <path d="M18 17.5 Q24 16.5 30 17" stroke="#f2a35e" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- butter pat -->
  <rect x="26" y="10" width="13" height="8" rx="2.5" fill="#fff0a6"/>
  <rect x="26" y="10" width="13" height="3" rx="1.5" fill="#fff8d2"/>
</svg>
