[workspace]
resolver = "2"
members = [
    "crates/pancake-compositor",
    "crates/pancake-config",
    "crates/pancake-ipc",
    "crates/pancake-panel",
    "crates/pancake-settings",
    "crates/pancake-hello",
    "crates/pancake-draw",
    "crates/pancake-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
pancake-config = { path = "crates/pancake-config" }
pancake-ipc = { path = "crates/pancake-ipc" }
pancake-draw = { path = "crates/pancake-draw" }
wayland-server = "0.31"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "client"] }
memmap2 = "0.9"
xkbcommon = "0.8"
wayland-protocols-wlr = { version = "0.3", features = ["server", "client"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
